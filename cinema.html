<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cinema — Animal Blue House</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #3a8a3a;
    --verde-glow: rgba(58,138,58,0.35);
    --giallo: #F5C518;
    --arancio: #FF8C00;
    --rosso: #E53935;
    --testo: #f0f0e8;
    --testo-muted: rgba(240,240,232,0.6);
    --testo-dim: rgba(240,240,232,0.35);
    --border: rgba(255,255,255,0.12);
    --surface: rgba(255,255,255,0.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Fredoka',sans-serif; color:var(--testo); min-height:100vh; }

  .bg { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse at top left, #1a3a1a 0%, #0d1f0d 45%, #050f05 100%); }
  .bg-glow { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse at 80% 20%, rgba(58,138,58,0.12) 0%, transparent 55%), radial-gradient(ellipse at 20% 80%, rgba(245,197,24,0.06) 0%, transparent 50%); pointer-events:none; }

  .container { max-width:480px; margin:0 auto; padding:0 0 48px; position:relative; z-index:2; }

  /* Top bar */
  .top-bar { padding:20px 20px 16px; display:flex; align-items:center; gap:14px; position:relative; }
  .back-btn {
    width:40px; height:40px; border-radius:50%;
    background:rgba(58,138,58,0.25);
    border:1.5px solid rgba(58,138,58,0.5);
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; font-size:20px; color:#fff;
    box-shadow:0 0 16px rgba(58,138,58,0.3);
    flex-shrink:0;
  }
  .page-title { font-size:22px; font-weight:700; color:var(--testo); letter-spacing:0.5px; }
  .admin-link { margin-left:auto; font-size:12px; color:var(--testo-dim); cursor:pointer; padding:4px 10px; border:0.5px solid rgba(255,255,255,0.1); border-radius:20px; }

  /* Counter */
  .counter-card {
    margin:4px 16px 20px;
    background:rgba(255,255,255,0.06);
    border-radius:22px; padding:24px 20px;
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    text-align:center;
    box-shadow:0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .counter-label { font-size:12px; font-weight:500; color:var(--testo-dim); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; }
  .counter-number { font-size:88px; font-weight:700; line-height:1; transition:color 0.5s; }
  .counter-sub { font-size:14px; color:var(--testo-dim); margin-top:2px; }
  .counter-bar { height:6px; background:rgba(255,255,255,0.08); border-radius:3px; margin:16px 0 10px; overflow:hidden; }
  .counter-bar-fill { height:6px; border-radius:3px; transition:width 0.8s ease, background 0.5s; }
  .counter-status { font-size:16px; font-weight:600; letter-spacing:0.5px; }

  /* Selezione posti */
  .seats-section { padding:0 16px; margin-bottom:20px; }
  .seats-title { font-size:15px; font-weight:600; color:var(--testo-muted); margin-bottom:14px; text-align:center; }
  .seats-visual { display:flex; gap:10px; justify-content:center; }
  .seat-dot {
    width:64px; height:64px; border-radius:14px;
    border:2px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:700; color:var(--testo-dim);
    transition:all 0.2s; background:rgba(255,255,255,0.05);
    cursor:pointer;
  }
  .seat-dot:active { transform:scale(0.93); }
  .seat-dot.active {
    background:var(--verde);
    border-color:var(--verde);
    color:#fff;
    box-shadow:0 0 20px var(--verde-glow);
  }

  /* Barra prenota — inline non fissa */
  .booking-bar {
    margin:0 16px;
    background:rgba(58,138,58,0.15);
    border:1.5px solid rgba(58,138,58,0.35);
    border-radius:16px; padding:14px 18px;
    display:flex; align-items:center; gap:12px;
    backdrop-filter:blur(10px);
  }
  .selected-info { flex:1; }
  .selected-count { font-size:17px; font-weight:700; color:var(--testo); }
  .selected-hint { font-size:12px; color:var(--testo-dim); margin-top:2px; }
  .btn-prenota {
    background:var(--verde); color:#fff; border:none; border-radius:12px;
    padding:12px 20px; font-size:15px; font-weight:700;
    font-family:'Fredoka',sans-serif; cursor:pointer; white-space:nowrap;
    box-shadow:0 0 20px var(--verde-glow);
    transition:opacity 0.2s, transform 0.1s;
  }
  .btn-prenota:disabled { background:rgba(255,255,255,0.1); color:var(--testo-dim); cursor:default; box-shadow:none; }
  .btn-prenota:not(:disabled):active { opacity:0.85; transform:scale(0.97); }

  /* Modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:flex-end; justify-content:center; }
  .modal-overlay.active { display:flex; }
  .modal { background:#0d1f0d; border:1px solid rgba(58,138,58,0.3); border-radius:24px 24px 0 0; padding:24px; width:100%; max-width:480px; animation:slideUp 0.3s ease; }
  @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
  .modal h3 { font-size:22px; font-weight:700; margin-bottom:4px; }
  .modal-recap { font-size:14px; color:var(--testo-muted); margin-bottom:20px; }
  .modal input { width:100%; background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.12); border-radius:12px; padding:14px; font-size:15px; color:var(--testo); font-family:'Fredoka',sans-serif; outline:none; margin-bottom:12px; }
  .modal input:focus { border-color:var(--verde); }
  .modal input::placeholder { color:var(--testo-dim); }
  .modal-btns { display:flex; gap:10px; }
  .btn-confirm { flex:1; background:var(--verde); color:#fff; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; font-family:'Fredoka',sans-serif; cursor:pointer; box-shadow:0 0 16px var(--verde-glow); }
  .btn-cancel { background:rgba(255,255,255,0.08); color:var(--testo-muted); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px 18px; font-size:15px; font-family:'Fredoka',sans-serif; cursor:pointer; }

  /* Admin */
  .admin-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:center; justify-content:center; padding:24px; }
  .admin-overlay.active { display:flex; }
  .admin-modal { background:#0d1f0d; border:1px solid rgba(58,138,58,0.3); border-radius:20px; padding:24px; width:100%; max-width:360px; }
  .admin-modal h3 { font-size:20px; font-weight:700; margin-bottom:6px; }
  .admin-modal p { font-size:14px; color:var(--testo-muted); margin-bottom:16px; }
  .admin-modal input { width:100%; background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.12); border-radius:12px; padding:12px 14px; font-size:15px; color:var(--testo); font-family:'Fredoka',sans-serif; outline:none; margin-bottom:12px; }
  .admin-modal input:focus { border-color:var(--verde); }
  .admin-actions { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .btn-reset { background:rgba(229,57,53,0.15); color:#ff6b6b; border:1.5px solid rgba(229,57,53,0.3); border-radius:12px; padding:13px; font-size:15px; font-family:'Fredoka',sans-serif; cursor:pointer; font-weight:600; }
  .btn-download { background:rgba(58,138,58,0.15); color:#7ec87e; border:1.5px solid rgba(58,138,58,0.3); border-radius:12px; padding:13px; font-size:15px; font-family:'Fredoka',sans-serif; cursor:pointer; font-weight:600; }
  .btn-close-admin { background:rgba(255,255,255,0.06); color:var(--testo-muted); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:13px; font-size:15px; font-family:'Fredoka',sans-serif; cursor:pointer; width:100%; margin-top:6px; }

  .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(10px); background:rgba(20,40,20,0.95); border:1px solid rgba(58,138,58,0.4); border-radius:14px; padding:12px 20px; font-size:14px; color:var(--testo); z-index:300; opacity:0; transition:all 0.3s; white-space:nowrap; pointer-events:none; backdrop-filter:blur(10px); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .spinner { width:24px; height:24px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--verde); border-radius:50%; animation:spin 0.8s linear infinite; margin:40px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-glow"></div>
<div class="container">
  <div class="top-bar">
    <a class="back-btn" href="index.html">←</a>
    <div class="page-title" id="page-title">🎬 Serata Cinema</div>
    <span class="admin-link" onclick="openAdmin()">admin</span>
  </div>

  <div class="counter-card">
    <div class="counter-label">Posti disponibili</div>
    <div class="counter-number" id="counter-num"><div class="spinner"></div></div>
    <div class="counter-sub">su 90 posti totali</div>
    <div class="counter-bar"><div class="counter-bar-fill" id="counter-fill" style="width:0%"></div></div>
    <div class="counter-status" id="counter-status"></div>
  </div>

  <div class="seats-section">
    <div class="seats-title">Quanti posti vuoi prenotare?</div>
    <div class="seats-visual">
      <div class="seat-dot" onclick="selectNum(1)">1</div>
      <div class="seat-dot" onclick="selectNum(2)">2</div>
      <div class="seat-dot" onclick="selectNum(3)">3</div>
      <div class="seat-dot" onclick="selectNum(4)">4</div>
    </div>
  </div>

  <div class="booking-bar">
    <div class="selected-info">
      <div class="selected-count" id="selected-count">Nessun posto selezionato</div>
      <div class="selected-hint" id="selected-hint">Tocca un numero qui sopra</div>
    </div>
    <button class="btn-prenota" id="btn-prenota" disabled onclick="openModal()">Prenota →</button>
  </div>
</div>

<!-- Modal dati -->
<div class="modal-overlay" id="booking-modal">
  <div class="modal">
    <h3>I tuoi dati</h3>
    <div class="modal-recap" id="modal-recap"></div>
    <input type="text" id="booking-name" placeholder="Nome e Cognome" autocomplete="off" />
    <input type="tel" id="booking-contact" placeholder="Telefono (opzionale)" autocomplete="off" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Indietro</button>
      <button class="btn-confirm" onclick="confirmBooking()">Conferma</button>
    </div>
  </div>
</div>

<!-- Modal admin -->
<div class="admin-overlay" id="admin-modal">
  <div class="admin-modal">
    <h3>Area Admin</h3>
    <p>Inserisci la password per accedere</p>
    <input type="password" id="admin-password" placeholder="Password" />
    <button class="btn-confirm" style="width:100%;margin-bottom:0;" id="admin-login-btn" onclick="checkAdmin()">Accedi</button>
    <div class="admin-actions" id="admin-actions" style="display:none;">
      <button class="btn-download" onclick="downloadData()">⬇ Scarica prenotazioni</button>
      <button class="btn-reset" onclick="resetSeats()">↺ Azzera tutti i posti</button>
    </div>
    <button class="btn-close-admin" onclick="closeAdmin()">✕ Chiudi</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, onValue, set, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

  // Carica titolo film dallo Sheet
  (async () => {
    try {
      const SHEET_ID = '1fjfNvu2nO_8ntIycM9L-qzc7uCL6roEZ-wGypsiqU1w';
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Eventi`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47, text.length - 2));
      const rows = json.table.rows;
      for (const row of rows) {
        const tipo = (row.c[3]?.v || '').toLowerCase();
        if (tipo === 'cinema') {
          const titoloFilm = row.c[6]?.v || '';
          if (titoloFilm) {
            document.getElementById('page-title').textContent = '🎬 ' + titoloFilm;
          }
          break;
        }
      }
    } catch(e) {}
  })();

  const app = initializeApp({ databaseURL:"https://animal-blue-house-default-rtdb.europe-west1.firebasedatabase.app" });
  const db = getDatabase(app);
  const MAX = 90;
  const ADMIN_PASSWORD = "abh2026";
  let seatsData = {};
  let selectedNum = 0;

  onValue(ref(db, 'seats'), (snap) => {
    seatsData = snap.val() || {};
    updateCounter();
  });

  function updateCounter() {
    const occupied = Object.values(seatsData).reduce((s,v) => s + (v.count||1), 0);
    const free = Math.max(0, MAX - occupied);
    const perc = Math.round((occupied / MAX) * 100);
    document.getElementById('counter-num').textContent = free;
    const fill = document.getElementById('counter-fill');
    fill.style.width = perc + '%';
    let color, status;
    if (free === 0) { color='#E53935'; status='SOLD OUT 🔴'; }
    else if (free <= 15) { color='#FF8C00'; status='Ultimi posti! 🟠'; }
    else if (free <= 30) { color='#F5C518'; status='Pochi posti rimasti 🟡'; }
    else { color='#3a8a3a'; status='Disponibile 🟢'; }
    document.getElementById('counter-num').style.color = color;
    fill.style.background = color;
    document.getElementById('counter-status').textContent = status;
    document.getElementById('counter-status').style.color = color;
    if (free === 0) {
      document.querySelectorAll('.seat-dot').forEach(d => { d.style.opacity='0.3'; d.style.pointerEvents='none'; });
      document.getElementById('selected-hint').textContent = 'Tutti i posti sono esauriti';
    }
  }

  window.selectNum = function(n) {
    selectedNum = n;
    document.querySelectorAll('.seat-dot').forEach((d,i) => {
      d.classList.toggle('active', i < n);
      d.textContent = i < n ? '✓' : i+1;
    });
    document.getElementById('selected-count').textContent = `${n} posto${n>1?'i':''} selezionato${n>1?'i':''}`;
    document.getElementById('selected-hint').textContent = 'Clicca Prenota per continuare';
    document.getElementById('btn-prenota').disabled = false;
  };

  window.openModal = function() {
    if (selectedNum === 0) return;
    document.getElementById('modal-recap').textContent = `${selectedNum} posto${selectedNum>1?'i':''} — assegnati per ordine di arrivo`;
    document.getElementById('booking-name').value = '';
    document.getElementById('booking-contact').value = '';
    document.getElementById('booking-modal').classList.add('active');
    setTimeout(() => document.getElementById('booking-name').focus(), 350);
  };
  window.closeModal = function() { document.getElementById('booking-modal').classList.remove('active'); };

  window.confirmBooking = async function() {
    const name = document.getElementById('booking-name').value.trim();
    if (!name) { showToast('Inserisci il tuo nome'); return; }
    const contact = document.getElementById('booking-contact').value.trim();
    const bookingId = Date.now().toString();
    await set(ref(db, `seats/${bookingId}`), { name, contact, count:selectedNum, timestamp:new Date().toISOString() });
    closeModal();
    showToast(`✓ Prenotazione confermata per ${selectedNum} posto${selectedNum>1?'i':''}!`);
    selectedNum = 0;
    document.querySelectorAll('.seat-dot').forEach((d,i) => { d.classList.remove('active'); d.textContent = i+1; });
    document.getElementById('selected-count').textContent = 'Nessun posto selezionato';
    document.getElementById('selected-hint').textContent = 'Tocca un numero qui sopra';
    document.getElementById('btn-prenota').disabled = true;
  };

  window.openAdmin = function() {
    document.getElementById('admin-modal').classList.add('active');
    document.getElementById('admin-actions').style.display = 'none';
    document.getElementById('admin-password').style.display = 'block';
    document.getElementById('admin-login-btn').style.display = 'block';
    document.getElementById('admin-password').value = '';
  };
  window.closeAdmin = function() { document.getElementById('admin-modal').classList.remove('active'); };
  window.checkAdmin = function() {
    if (document.getElementById('admin-password').value === ADMIN_PASSWORD) {
      document.getElementById('admin-actions').style.display = 'flex';
      document.getElementById('admin-password').style.display = 'none';
      document.getElementById('admin-login-btn').style.display = 'none';
    } else { showToast('Password errata'); }
  };
  window.resetSeats = async function() {
    if (!confirm('Sei sicuro? Tutte le prenotazioni verranno cancellate.')) return;
    await remove(ref(db, 'seats'));
    closeAdmin();
    showToast('Tutti i posti sono stati azzerati');
  };
  window.downloadData = function() {
    const rows = [['ID','Nome','Contatto','Posti','Data']];
    Object.entries(seatsData).sort().forEach(([id,data]) => {
      rows.push([id, data.name, data.contact||'', data.count||1, new Date(data.timestamp).toLocaleString('it-IT')]);
    });
    const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `prenotazioni-${new Date().toLocaleDateString('it-IT').replace(/\//g,'-')}.csv`;
    a.click(); showToast('Lista scaricata!');
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }
</script>
</body>
</html>

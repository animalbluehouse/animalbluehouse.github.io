<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Evento — Animal Blue House</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #3a8a3a;
    --verde-light: #5aaa5a;
    --verde-glow: rgba(58,138,58,0.3);
    --giallo: #F5C518;
    --testo: #f0f0e8;
    --testo-muted: rgba(240,240,232,0.6);
    --testo-dim: rgba(240,240,232,0.3);
    --border: rgba(255,255,255,0.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Fredoka',sans-serif; color:var(--testo); min-height:100vh; background:#050f05; overflow-x:hidden; }

  .bg { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse at top left, #1a3a1a 0%, #0d1f0d 45%, #050f05 100%); }
  .bg-glow { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse at 70% 10%, rgba(58,138,58,0.1) 0%, transparent 50%); pointer-events:none; }

  .container { max-width:480px; margin:0 auto; padding:0 0 48px; position:relative; z-index:2; }

  .back-btn {
    position:fixed; top:20px; left:20px; z-index:10;
    width:40px; height:40px; border-radius:50%;
    background:rgba(58,138,58,0.3);
    border:1.5px solid rgba(58,138,58,0.5);
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; font-size:20px; color:#fff;
    box-shadow:0 0 16px rgba(58,138,58,0.3);
  }

  /* Header compatto */
  .event-header {
    padding:72px 20px 20px;
    position:relative; overflow:hidden;
  }
  .header-deco { position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--verde), var(--giallo), var(--verde), transparent); }
  .event-tipo-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(58,138,58,0.2); border:1px solid rgba(58,138,58,0.35); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:600; color:var(--verde-light); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
  .event-titolo { font-size:28px; font-weight:700; color:var(--testo); line-height:1.1; margin-bottom:10px; }
  .event-meta-row { display:flex; gap:8px; flex-wrap:wrap; }
  .meta-pill { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,0.07); border:0.5px solid rgba(255,255,255,0.1); border-radius:20px; padding:4px 10px; font-size:12px; color:var(--testo-muted); }

  /* Descrizione */
  .desc-section { padding:20px 20px 0; }
  .desc-text { font-size:15px; color:var(--testo-muted); line-height:1.8; }
  .desc-text p { margin-bottom:8px; }
  .desc-text p:last-child { margin-bottom:0; }

  /* Divisore */
  .divider { margin:24px 20px 0; height:1px; background:linear-gradient(90deg, transparent, rgba(58,138,58,0.4), transparent); }

  /* Foto grandi scorrevoli */
  .photos-section { padding:24px 0 0; }
  .photos-label { font-size:11px; font-weight:600; letter-spacing:2px; color:var(--verde); padding:0 20px; margin-bottom:16px; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
  .photos-label::after { content:''; flex:1; height:1px; background:rgba(58,138,58,0.3); }

  .photos-scroll {
    display:flex; gap:14px;
    padding:0 20px 20px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .photos-scroll::-webkit-scrollbar { display:none; }

  .photo-item {
    flex-shrink:0;
    width:280px;
    scroll-snap-align:center;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
    position:relative;
  }
  .photo-item img {
    width:100%; height:320px;
    object-fit:cover; display:block;
  }
  .photo-item .photo-overlay {
    position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(to top, rgba(5,15,5,0.7) 0%, transparent 60%);
    padding:16px 14px 12px;
    font-size:12px; color:rgba(240,240,232,0.5);
  }

  /* Hint scorri */
  .scroll-hint { display:flex; align-items:center; justify-content:center; gap:6px; padding:4px 0 0; font-size:12px; color:var(--testo-dim); }
  .scroll-hint-dots { display:flex; gap:5px; }
  .sdot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.15); transition:all 0.3s; }
  .sdot.active { background:var(--verde); width:14px; border-radius:3px; }

  /* Lightbox */
  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.93); z-index:100; align-items:center; justify-content:center; }
  .lightbox.active { display:flex; }
  .lightbox img { max-width:92vw; max-height:82vh; border-radius:14px; object-fit:contain; }
  .lightbox-close { position:absolute; top:20px; right:20px; font-size:28px; color:#fff; cursor:pointer; }

  .spinner { width:24px; height:24px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--verde); border-radius:50%; animation:spin 0.8s linear infinite; margin:80px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .fade-in { animation:fadeIn 0.4s ease forwards; opacity:0; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-glow"></div>
<a class="back-btn" href="index.html">←</a>

<div class="container">
  <div id="content"><div class="spinner"></div></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">✕</span>
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
  const SHEET_ID = '1fjfNvu2nO_8ntIycM9L-qzc7uCL6roEZ-wGypsiqU1w';
  const SHEET_NAME = 'Eventi';
  const idx = parseInt(new URLSearchParams(window.location.search).get('i') || '0');
  const emojis = { cinema:'🎬', torneo:'🃏', cultura:'🎭', musica:'🎵', sport:'⚽', comedy:'🎤', party:'🎉' };

  const eventPhotos = {
    'polleggedi': ['polleggedi-1.jpg','polleggedi-2.jpg','polleggedi-3.jpg','polleggedi-4.jpg','polleggedi-5.jpg']
  };

  const eventDescriptions = {
    'polleggedi': `<p>Polleggedì non è solo una serata — è il rituale che trasforma un venerdì qualunque in qualcosa che aspetti tutta la settimana.</p><p>Musica, risate, facce che conosci e facce nuove. Un posto dove puoi arrivare da solo e sentirti già a casa dopo cinque minuti.</p><p>Ci vediamo lì. 🛸</p>`
  };

  function getKey(titolo) {
    return (titolo||'').toLowerCase().replace(/\s+/g,'').replace(/[àáâ]/g,'a').replace(/[èéê]/g,'e').replace(/[ìíî]/g,'i').replace(/[òóô]/g,'o').replace(/[ùúû]/g,'u');
  }

  async function load() {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47, text.length - 2));
      let rows = json.table.rows;
      if (rows[0] && (rows[0].c[0]?.v||'').toString().toUpperCase() === 'TITOLO') rows = rows.slice(1);
      const row = rows[idx];
      if (!row) { document.getElementById('content').innerHTML = '<p style="padding:80px 24px;color:rgba(255,255,255,0.4);text-align:center">Evento non trovato.</p>'; return; }

      const titolo = row.c[0]?.v||'';
      const dataRaw = row.c[1];
      const data = dataRaw?.f || (typeof dataRaw?.v === 'string' ? dataRaw.v : '') || '';
      const ora = row.c[2]?.v||'';
      const tipo = row.c[3]?.v||'';
      const emoji = emojis[(tipo||'').toLowerCase()] || '📅';
      const key = getKey(titolo);
      const photos = eventPhotos[key] || [];
      const desc = eventDescriptions[key] || (row.c[4]?.v ? `<p>${row.c[4].v}</p>` : '');

      document.title = `${titolo} — Animal Blue House`;

      const photosHTML = photos.length > 0 ? `
        <div class="photos-section fade-in">
          <div class="photos-label">Galleria</div>
          <div class="photos-scroll" id="photos-scroll">
            ${photos.map((p,i) => `
              <div class="photo-item" onclick="openLightbox('${p}')">
                <img src="${p}" alt="Foto ${i+1}" loading="lazy" />
                <div class="photo-overlay">${i+1} / ${photos.length}</div>
              </div>`).join('')}
          </div>
          <div class="scroll-hint">
            <div class="scroll-hint-dots" id="scroll-dots">
              ${photos.map((_,i) => `<div class="sdot ${i===0?'active':''}"></div>`).join('')}
            </div>
          </div>
        </div>` : '';

      document.getElementById('content').innerHTML = `
        <div class="event-header fade-in">
          <div class="header-deco"></div>
          <div class="event-tipo-badge">${emoji} ${tipo||'Evento'}</div>
          <div class="event-titolo">${titolo}</div>
          <div class="event-meta-row">
            ${data ? `<div class="meta-pill">📅 ${data}</div>` : ''}
            ${ora ? `<div class="meta-pill">🕐 ${ora}</div>` : ''}
          </div>
        </div>
        ${desc ? `<div class="desc-section fade-in"><div class="desc-text">${desc}</div></div>` : ''}
        ${photos.length > 0 ? '<div class="divider"></div>' : ''}
        ${photosHTML}`;

      // Dots scroll sync
      if (photos.length > 0) {
        const scroll = document.getElementById('photos-scroll');
        scroll?.addEventListener('scroll', () => {
          const itemW = 280 + 14;
          const active = Math.round(scroll.scrollLeft / itemW);
          document.querySelectorAll('.sdot').forEach((d,i) => d.classList.toggle('active', i === active));
        });
      }

    } catch(e) {
      document.getElementById('content').innerHTML = '<p style="padding:80px 24px;color:rgba(255,255,255,0.4);text-align:center">Errore nel caricamento.</p>';
    }
  }

  window.openLightbox = function(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('active');
  };
  window.closeLightbox = function() {
    document.getElementById('lightbox').classList.remove('active');
  };

  load();
</script>
</body>
</html>

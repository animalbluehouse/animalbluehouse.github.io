<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Animal Blue House</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #2D6A2D;
    --verde-light: #4CAF50;
    --giallo: #F5C518;
    --rosso: #E53935;
    --text: #1a1a1a;
    --text-muted: #555;
    --card-bg: rgba(255,255,255,0.92);
    --border: rgba(0,0,0,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:'DM Sans', sans-serif;
    color:var(--text);
    min-height:100vh;
    position:relative;
  }

  /* Sfondo giornali */
  .bg {
    position:fixed; inset:0; z-index:0;
    background-image: url('https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1200&q=80');
    background-size:cover;
    background-position:center;
    filter:blur(3px) brightness(0.85) saturate(0.4);
    transform:scale(1.05);
  }
  .bg-overlay {
    position:fixed; inset:0; z-index:1;
    background:rgba(240,235,220,0.55);
  }

  .container { max-width:480px; margin:0 auto; padding:0 0 48px; position:relative; z-index:2; }

  /* Header */
  header { padding:32px 20px 20px; text-align:center; }
  .logo-img { width:110px; height:110px; object-fit:contain; border-radius:50%; background:#fff; padding:6px; box-shadow:0 4px 20px rgba(0,0,0,0.15); }
  .week-badge {
    display:inline-block; margin-top:12px;
    background:rgba(255,255,255,0.85);
    border:2px solid var(--verde);
    border-radius:20px; padding:5px 16px;
    font-family:'Bangers',cursive; font-size:16px; letter-spacing:1px;
    color:var(--verde);
  }

  /* Sezione eventi */
  .section-label {
    font-family:'Bangers',cursive; font-size:13px; letter-spacing:2px;
    color:var(--text-muted); padding:0 20px; margin-bottom:12px;
    text-transform:uppercase;
  }

  .events-list { padding:0 16px; display:flex; flex-direction:column; gap:14px; }

  .event-card {
    background:var(--card-bg);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 3px 16px rgba(0,0,0,0.12);
    text-decoration:none;
    display:block;
    border:1.5px solid var(--border);
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .event-card:active { transform:scale(0.98); box-shadow:0 1px 8px rgba(0,0,0,0.1); }

  .event-poster {
    width:100%; aspect-ratio:16/9;
    background:#e0d9cc;
    display:flex; align-items:center; justify-content:center;
    font-size:40px; position:relative; overflow:hidden;
  }
  .event-poster img { width:100%; height:100%; object-fit:cover; filter:grayscale(30%); }
  .event-poster .fallback { font-size:40px; }

  .event-overlay {
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
  }
  .event-overlay-text {
    position:absolute; bottom:10px; left:12px; right:12px;
  }
  .event-overlay-title {
    font-family:'Bangers',cursive; font-size:22px; letter-spacing:1px;
    color:#fff; line-height:1.1; text-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  .event-overlay-date {
    font-family:'Bangers',cursive; font-size:16px; color:var(--giallo);
    letter-spacing:0.5px; margin-top:2px;
  }

  .event-footer {
    padding:10px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .event-tipo { font-size:11px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px; }
  .event-arrow {
    width:32px; height:32px; border-radius:50%;
    background:var(--verde); display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:16px;
  }

  /* Loading */
  .loading { text-align:center; padding:60px 24px; color:var(--text-muted); font-size:14px; }
  .spinner { width:28px; height:28px; border:3px solid rgba(0,0,0,0.1); border-top-color:var(--verde); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Contatti */
  .contacts { margin:28px 16px 0; background:var(--card-bg); border-radius:16px; padding:16px 18px; box-shadow:0 3px 16px rgba(0,0,0,0.1); border:1.5px solid var(--border); }
  .contacts-title { font-family:'Bangers',cursive; font-size:16px; letter-spacing:1px; color:var(--verde); margin-bottom:12px; }
  .contact-item { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:0.5px solid var(--border); font-size:14px; color:var(--text-muted); text-decoration:none; }
  .contact-item:last-child { border-bottom:none; }
  .contact-item span { font-size:18px; }

  .fade-in { animation:fadeIn 0.4s ease forwards; opacity:0; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-overlay"></div>
<div class="container">
  <header>
    <img src="logo.jpg" alt="Animal Blue House" class="logo-img" />
    <div class="week-badge" id="week-label">caricamento...</div>
  </header>

  <div class="section-label">Eventi in programma</div>
  <div class="events-list" id="events-list">
    <div class="loading"><div class="spinner"></div>Caricamento eventi...</div>
  </div>

  <div class="contacts">
    <div class="contacts-title">Contatti</div>
    <a class="contact-item" href="https://wa.me/393534918218" target="_blank"><span>💬</span> +39 353 4918218</a>
    <a class="contact-item" href="https://instagram.com/animalbluehouse" target="_blank"><span>📸</span> @animalbluehouse</a>
    <a class="contact-item" href="mailto:animalbluehouse.sm@gmail.com"><span>✉️</span> animalbluehouse.sm@gmail.com</a>
  </div>
</div>

<script>
  const SHEET_ID = '1fjfNvu2nO_8ntIycM9L-qzc7uCL6roEZ-wGypsiqU1w';
  const SHEET_NAME = 'Eventi';

  function getWeekLabel() {
    const now = new Date();
    const day = now.getDay();
    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
    const mon = new Date(now); mon.setDate(diff);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const fmt = d => d.toLocaleDateString('it-IT', { day:'numeric', month:'long' });
    return `${fmt(mon)} → ${fmt(sun)}`;
  }
  document.getElementById('week-label').textContent = getWeekLabel();

  function getTypeEmoji(tipo) {
    const map = { 'cinema':'🎬','torneo':'🃏','cultura':'🎭','musica':'🎵','sport':'⚽','comedy':'🎤','party':'🎉' };
    return map[(tipo||'').toLowerCase()] || '📅';
  }

  async function loadEvents() {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47, text.length - 2));
      const rows = json.table.rows;

      if (!rows || rows.length === 0) {
        document.getElementById('events-list').innerHTML = '<div class="loading">Nessun evento in programma.</div>';
        return;
      }

      const events = rows.map((row, i) => ({
        titolo: row.c[0]?.v || '',
        data: row.c[1]?.v || '',
        ora: row.c[2]?.v || '',
        tipo: row.c[3]?.v || '',
        descrizione: row.c[4]?.v || '',
        locandina: row.c[5]?.v || '',
        index: i
      })).filter(e => e.titolo);

      if (events.length === 0) {
        document.getElementById('events-list').innerHTML = '<div class="loading">Nessun evento in programma.</div>';
        return;
      }

      const html = events.map((ev, i) => {
        const emoji = getTypeEmoji(ev.tipo);
        const isCinema = (ev.tipo||'').toLowerCase() === 'cinema';
        const href = isCinema ? 'cinema.html' : `evento.html?i=${ev.index}`;
        const poster = ev.locandina
          ? `<img src="${ev.locandina}" alt="${ev.titolo}" loading="lazy" />`
          : `<div class="fallback">${emoji}</div>`;

        return `
          <a class="event-card fade-in" href="${href}" style="animation-delay:${i*0.08}s">
            <div class="event-poster">
              ${poster}
              <div class="event-overlay"></div>
              <div class="event-overlay-text">
                <div class="event-overlay-title">${ev.titolo}</div>
                ${ev.data ? `<div class="event-overlay-date">${ev.data}${ev.ora ? ' · ' + ev.ora : ''}</div>` : ''}
              </div>
            </div>
            <div class="event-footer">
              <div class="event-tipo">${ev.tipo || 'Evento'}</div>
              <div class="event-arrow">→</div>
            </div>
          </a>`;
      }).join('');

      document.getElementById('events-list').innerHTML = html;
    } catch(e) {
      document.getElementById('events-list').innerHTML = '<div class="loading">Errore nel caricamento.</div>';
    }
  }

  loadEvents();
</script>
</body>
</html>
